name: Release desktop packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test local kubeconfig imports
        run: node scripts/run-ci-tests.mjs
      - name: Build signed and notarized macOS DMGs (Apple Silicon and Intel)
        run: npm run app:release:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-workbench-macos
          path: release/Orbit-Workbench-*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test local kubeconfig imports
        run: node scripts/run-ci-tests.mjs
      - name: Build Windows packages
        run: npm run app:win
      - name: Audit Windows package contents
        run: npm run package:audit -- release/win-unpacked/resources/app.asar
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-workbench-windows
          path: |
            release/Orbit-Workbench-*.exe
            release/Orbit-Workbench-*.zip
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: orbit-workbench-macos
          path: release
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: orbit-workbench-windows
          path: release
      - name: Generate download checksums
        working-directory: release
        run: sha256sum Orbit-Workbench-*.dmg Orbit-Workbench-*.exe Orbit-Workbench-*.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Orbit-Workbench-*.dmg
            release/Orbit-Workbench-*.exe
            release/Orbit-Workbench-*.zip
            release/SHA256SUMS.txt
